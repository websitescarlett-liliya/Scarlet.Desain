<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempel Builder</title>
<style>
  *{box-sizing:border-box;font-family:Inter,Arial}
  body{margin:0;background:#fff;color:#000;display:flex;height:100vh}
  #left{width:42%;background:#0f1115;color:#fff;display:flex;flex-direction:column}
  #toolbar{display:flex;gap:8px;padding:12px;background:#fff;border-bottom:1px solid #eee;flex-wrap:wrap}
  button.tool{background:#000;color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
  button.tool:hover{opacity:.8}
  #code{flex:1;background:#0f1115;color:#e6e6e6;padding:16px;overflow:auto;white-space:pre;font-family:monospace;font-size:13px}
  #right{flex:1;background:#fff;padding:20px;overflow:auto;border-left:2px solid #000}
  #canvas{min-height:80%;border:2px dashed #000;border-radius:12px;padding:20px}
  .btn{padding:10px 20px;background:#000;color:#fff;border-radius:8px;border:0;margin:5px;cursor:pointer}
  .menu{background:#f5f5f5;padding:12px;margin:5px;border-radius:8px}
  .card{border:1px solid #000;padding:15px;border-radius:10px;margin:5px}
  #settings{padding:10px;background:#fff;border-top:1px solid #eee}
</style>
</head>
<body>
<div style="flex:1;display:flex;flex-direction:column;width:100%">
  <div id="toolbar">
    <button class="tool" onclick="addEl('tombol')">+ Tombol</button>
    <button class="tool" onclick="addEl('menu')">+ Menu</button>
    <button class="tool" onclick="addEl('fitur')">+ Fitur/Card</button>
    <button class="tool" onclick="addEl('teks')">+ Teks</button>
    <button class="tool" onclick="copyCode()" style="background:#fff;color:#000;border:1px solid #000">Salin Code</button>
  </div>
  <div style="display:flex;flex:1;overflow:hidden">
    <div id="left"><div id="code">// code akan muncul di sini</div></div>
    <div id="right"><h3>Desain Preview</h3><div id="canvas"></div>
      <div id="settings">
        <label>Warna Teks: <input type="color" id="cText" value="#000000" onchange="updateStyle()"></label>
        <label>Background: <input type="color" id="cBg" value="#ffffff" onchange="updateStyle()"></label>
      </div>
    </div>
  </div>
</div>
<script>
  const canvas=document.getElementById('canvas'), code=document.getElementById('code');
  function addEl(type){
    let el;
    if(type==='tombol'){el=document.createElement('button');el.className='btn';el.textContent='Tombol Baru';el.onclick=()=>alert('Klik!');}
    if(type==='menu'){el=document.createElement('div');el.className='menu';el.innerHTML='<b>Menu</b> | Home | Tentang | Kontak';}
    if(type==='fitur'){el=document.createElement('div');el.className='card';el.innerHTML='<h4>Fitur Baru</h4><p>Deskripsi fitur...</p>';}
    if(type==='teks'){el=document.createElement('p');el.textContent='Teks baru, klik untuk edit';el.contentEditable=true;}
    el.ondblclick=()=>el.remove();
    canvas.appendChild(el); updateCode();
  }
  function updateCode(){code.textContent=canvas.innerHTML.replace(/</g,'\n<');}
  function copyCode(){navigator.clipboard.writeText(canvas.innerHTML);alert('Code tersalin!');}
  function updateStyle(){
    document.getElementById('right').style.background=document.getElementById('cBg').value;
    document.getElementById('right').style.color=document.getElementById('cText').value;
  }
</script>
</body>
</html>
